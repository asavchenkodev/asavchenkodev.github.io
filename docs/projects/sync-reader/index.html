    <noscript><article><h1>Sync Reader</h1><h1 id="sync-reader">Sync Reader</h1>
<p>Sync Reader is a parallel text reader for learning German with Russian translations. It lets you read bilingual texts side by side, inspect words in context, save useful vocabulary, and export it for Anki.</p>
<p><a href="/tools/sync-reader/">Open the live tool</a></p>
<h2 id="why-i-built-it">Why I built it</h2>
<p>The main idea is to see a word immediately in sentence context instead of only seeing a direct translation. You can also read the text first in your native language and then in the language you are learning.</p>
<p>The app stays serverless: no account, subscription, or paid usage limit. Texts, folders, saved words, and study data are stored locally in the browser.</p>
<h2 id="features">Features</h2>
<ul>
<li>Parallel Russian and German reading panes.</li>
<li>Linked highlighting across both texts: click or hover a word to see its translation and grammar notes.</li>
<li>Saved vocabulary and Anki-style review.</li>
<li>TSV export for Anki.</li>
<li>A local library with folders and browser storage.</li>
<li>26 built-in texts at A2 and B1 level on everyday life, money, technology, work, and travel.</li>
<li>Import of plain-text files generated by an LLM, with problems reported per line.</li>
</ul>
<h2 id="how-to-add-your-own-text">How to add your own text</h2>
<ol>
<li>Open the tool and choose <strong>Add text</strong>. Describe the topic and level, then copy the prompt into Claude, ChatGPT, or Gemini.</li>
<li>Paste the whole reply back into the app and save it. Each sentence is a <code>DE:</code> line and an <code>RU:</code> line, and linked words are marked like <code>[den Schrank]4</code> with the same number on both sides.</li>
<li>To import texts you already have, drop <code>.txt</code> files or a whole folder onto the app. A folder becomes a library folder, and any broken lines are listed with their line numbers.</li>
</ol></article></noscript>
