    <title>Aleksandr Savchenko · /home/asv</title>

    <link rel="alternate" type="application/atom+xml" title="Aleksandr Savchenko" href="/feed.xml" />
    <link rel="preload" href="/content-manifest.json" as="fetch" crossorigin="anonymous" />
    <script>
      // Static entry pages (/notes/papers/, written by scripts/prerender.ts) open the app on the same #/ route.
      (function () {
        var page = location.pathname.replace(/index\.html$/, "");
        if (page !== "/" && !location.hash) history.replaceState(null, "", "/#" + page.replace(/\/$/, ""));
      })();
    </script>
    <script>
      window.goatcounter = { path: (p) => p + location.hash };
    </script>
    <script data-goatcounter="https://asv.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
